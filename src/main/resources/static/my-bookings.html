
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings - CineBook</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #101018;
    color: white;
}

header {
    background: #20202c;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: #f5c518;
    margin: 0;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 850px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    color: #f5c518;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.booking-card {
    background: #20202c;
    border-radius: 12px;
    margin-bottom: 25px;
    overflow: hidden;
    border: 1px solid #383849;
}

.ticket-top {
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.ticket-top h3 {
    color: #f5c518;
    margin: 0;
}

.booking-id {
    color: #aaa;
    font-size: 13px;
    margin-top: 7px;
}

.status {
    padding: 7px 13px;
    border-radius: 20px;
    background: #176b42;
    font-size: 12px;
    font-weight: bold;
}

.status.cancelled {
    background: #a83232;
}

.ticket-divider {
    border-top: 2px dashed #555568;
    margin: 0 22px;
}

.ticket-details {
    padding: 22px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.detail-label {
    color: #999;
    font-size: 12px;
    margin-bottom: 7px;
}

.detail-value {
    color: white;
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.price {
    color: #f5c518;
    font-size: 20px;
}

.ticket-bottom {
    padding: 15px 22px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.cancel-button {
    background: #b83232;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.cancel-button:hover {
    background: #d13c3c;
}

.empty-message {
    color: #ccc;
    background: #20202c;
    padding: 25px;
    border-radius: 10px;
}

footer {
    text-align: center;
    padding: 20px;
    background: #20202c;
    color: #aaa;
    margin-top: 40px;
}

@media(max-width: 550px) {
    .ticket-details {
        grid-template-columns: 1fr;
    }

    .ticket-top {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <h2>CineBook</h2>
    <a href="index.html">Home</a>
</header>

<div class="container">

    <h1>My Bookings</h1>
    <p class="subtitle">Your movie tickets and booking history</p>

    <div id="bookingList">
        <p>Loading your bookings...</p>
    </div>

</div>

<footer>
    CineBook © 2026
</footer>

<script>

async function loadBookings() {

    const bookingList = document.getElementById("bookingList");

    try {

        const response = await fetch("/api/bookings/my");

        if (response.status === 401 || response.status === 403) {
            bookingList.innerHTML =
                '<p class="empty-message">Please login to view your bookings.</p>';
            return;
        }

        if (!response.ok) {
            throw new Error("Unable to load bookings");
        }

        const bookings = await response.json();

        if (bookings.length === 0) {
            bookingList.innerHTML =
                '<p class="empty-message">You have no bookings yet.</p>';
            return;
        }

        bookingList.innerHTML = bookings.map(booking => {

            const cancelled = booking.status === "CANCELLED";

            return `
                <div class="booking-card">

                    <div class="ticket-top">
                        <div>
                            <h3>CineBook Movie Ticket</h3>
                            <div class="booking-id">
                                Booking #${booking.id}
                            </div>
                        </div>

                        <span class="status ${cancelled ? "cancelled" : ""}">
                            ${booking.status}
                        </span>
                    </div>

                    <div class="ticket-divider"></div>

                    <div class="ticket-details">

    <div>
        <div class="detail-label">MOVIE</div>
        <div class="detail-value">${booking.movieTitle}</div>
    </div>

    <div>
        <div class="detail-label">SHOW ID</div>
        <div class="detail-value">${booking.showId}</div>
    </div>

    <div>
        <div class="detail-label">SHOW DATE</div>
        <div class="detail-value">
            ${booking.showDate || "Not available"}
        </div>
    </div>

    <div>
        <div class="detail-label">SHOW TIME</div>
        <div class="detail-value">
            ${booking.showTime
                ? new Date("2000-01-01T" + booking.showTime)
                    .toLocaleTimeString("en-US", {
                        hour: "numeric",
                        minute: "2-digit"
                    })
                : "Not available"}
        </div>
    </div>

    <div>
        <div class="detail-label">SELECTED SEATS</div>
        <div class="detail-value">${booking.seats}</div>
    </div>

    <div>
        <div class="detail-label">TOTAL AMOUNT</div>
        <div class="detail-value price">₹${booking.totalPrice}</div>
    </div>

    <div>
        <div class="detail-label">BOOKING DATE</div>
        <div class="detail-value">
            ${booking.bookingTime
                ? new Date(booking.bookingTime).toLocaleString()
                : "Not available"}
        </div>
    </div>

</div>


                       

                    </div>

                    <div class="ticket-bottom">
                        <small style="color:#999">
                            Thank you for booking with CineBook!
                        </small>

                        ${!cancelled ? `
                            <button class="cancel-button"
                                onclick="cancelBooking(${booking.id})">
                                Cancel Booking
                            </button>
                        ` : ""}
                    </div>

                </div>
            `;

        }).join("");

    } catch (error) {

        bookingList.innerHTML =
            '<p class="empty-message">Unable to load bookings. Please try again.</p>';

    }
}

async function cancelBooking(id) {

    if (!confirm("Are you sure you want to cancel this booking?")) {
        return;
    }

    try {

        const response = await fetch(`/api/bookings/${id}`, {
            method: "DELETE"
        });

        const result = await response.text();

        if (!response.ok) {
            alert(result || "Unable to cancel booking");
            return;
        }

        alert("Booking cancelled successfully!");

        loadBookings();

    } catch (error) {

        alert("Something went wrong.");

    }
}

loadBookings();

</script>

</body>
</html>
